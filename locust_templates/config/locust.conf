# Locust configuration file
# This file can be used with: locust --config=locust.conf

# Web UI settings
web-host = 0.0.0.0
web-port = 8089

# Test settings
users = 10
spawn-rate = 1
run-time = 5m

# Logging
loglevel = INFO
logfile = locust.log

# Output
html = report.html
csv = results

# Distributed mode (uncomment if using master/worker setup)
# master = true
# expect-workers = 2
